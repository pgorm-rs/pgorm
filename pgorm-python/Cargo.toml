[package]
name = "pgorm-python"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Native Python builders and asynchronous PostgreSQL access through pgorm"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pgorm-rs/pgorm"
readme = "README.md"

# [spec:pgorm:req:python.optional]
# A separate workspace keeps Python configuration out of ordinary Rust builds.
[workspace]

[lib]
name = "pgorm_python"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone-module"]
standalone-module = []
extension-module = ["pyo3/extension-module"]
# Target PostgreSQL 19 instead of 18 ([spec:pgorm:req:sql.target]); the
# capability manifest's `features` then lists `pg-19`.
pg-19 = ["pgorm/pg-19"]

[dependencies]
pgorm = { version = "=0.2.0", path = ".." }
pyo3 = { version = "=0.29.2", features = ["jiff-02", "rust_decimal", "uuid"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "float_roundtrip"] }
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
rust_decimal = "=1.43.0"
uuid = "=1.26.0"
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }
tokio = { version = "=1.53.1", features = ["sync", "time", "rt-multi-thread"] }
tokio-postgres = "=0.7.18"
bytes = "=1.12.1"
fallible-iterator = "=0.2.0"
futures-util = "=0.3.34"
postgres-protocol = "=0.6.12"
tokio-util = { version = "=0.7.19", features = ["rt"] }
# TLS through rustls, verifying against the platform's trust store or a CA the
# caller supplies; PEM is read through rustls' own pki-types.
tokio-postgres-rustls = "=0.13.0"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"

[build-dependencies]
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
