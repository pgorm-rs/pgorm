[package]
name = "pgorm-python"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Native Python builders and asynchronous PostgreSQL access through pgorm"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pgorm-rs/pgorm"
readme = "README.md"

# [spec:pgorm:req:python.optional]
# A separate workspace keeps Python configuration out of ordinary Rust builds.
[workspace]

[lib]
name = "pgorm_python"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone-module"]
standalone-module = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pgorm = { version = "=0.2.0", path = ".." }
pyo3 = { version = "=0.29.2", features = ["jiff-02", "rust_decimal", "uuid"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "float_roundtrip"] }
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
rust_decimal = "=1.43.0"
uuid = "=1.26.0"
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }
tokio = { version = "=1.53.1", features = ["sync", "time", "rt-multi-thread"] }
tokio-postgres = "=0.7.18"
bytes = "=1.12.1"
fallible-iterator = "=0.2.0"
futures-util = "=0.3.34"
postgres-protocol = "=0.6.12"
tokio-util = { version = "=0.7.19", features = ["rt"] }
tokio-postgres-rustls = "=0.13.0"
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
webpki-roots = "=1.0.9"

[build-dependencies]
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The separate workspace above keeps Python configuration out of ordinary Rust
# builds, and a crates-io patch table is read from the workspace root and
# nowhere else — so this crate resolves its own patches and the root
# manifest's are invisible here. Every entry the root pins has to be repeated,
# verbatim: without the prqlc fork the extension links upstream prqlc and
# compiles different SQL from the one every pgorm test exercises. `build.rs`
# fails the build when the two tables drift apart.
[patch.crates-io]
prqlc = { git = "https://github.com/necessary-nu/prql.git", rev = "d6f2fa9753699a4c97385679aa908a032a4afbe4" }
