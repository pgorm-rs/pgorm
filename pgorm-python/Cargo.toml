[package]
name = "pgorm-python"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Native Python builders and asynchronous PostgreSQL access through pgorm"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pgorm-rs/pgorm"
readme = "README.md"

# [spec:pgorm:req:python.optional]
# A separate workspace keeps Python configuration out of ordinary Rust builds.
[workspace]

[lib]
name = "pgorm_python"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pgorm = { version = "=0.2.0", path = ".." }
pyo3 = { version = "=0.29.2", features = ["chrono", "rust_decimal", "uuid"] }
serde_json = "=1.0.151"

[build-dependencies]
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

