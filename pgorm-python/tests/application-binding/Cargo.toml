[package]
name = "pgorm-python-application-fixture"
version = "0.2.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pgorm-python = { path = "../..", default-features = false }
pgorm = { path = "../../.." }
pyo3 = "=0.29.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
async-trait = "=0.1.92"
tokio = { version = "=1.53.1", features = ["time"] }
futures-util = "=0.3.34"

[lints.rust]
unsafe_code = "forbid"

# This fixture declares its own workspace above, and a crates-io patch table is
# read from a workspace root and nowhere else — so the root's prqlc pin has to
# be repeated here or the fixture links stock prqlc and the binding under test
# compiles different SQL from the extension pgorm-python ships.
[patch.crates-io]
prqlc = { git = "https://github.com/necessary-nu/prql.git", rev = "d6f2fa9753699a4c97385679aa908a032a4afbe4" }
