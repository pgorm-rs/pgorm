[package]
name = "pgorm-python-codegen-entities"
version = "0.2.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
pgorm = { path = "../../.." }
serde = { version = "=1.0.229", features = ["derive"] }
async-trait = "=0.1.92"
tokio = { version = "=1.53.1", features = ["time"] }

[lints.rust]
unsafe_code = "forbid"

# This fixture declares its own workspace above, and a crates-io patch table is
# read from a workspace root and nowhere else — so the root's prqlc pin has to
# be repeated here or the generated entities are compiled against a different
# SQL generator from the one every other pgorm test exercises.
[patch.crates-io]
prqlc = { git = "https://github.com/necessary-nu/prql.git", rev = "d6f2fa9753699a4c97385679aa908a032a4afbe4" }
