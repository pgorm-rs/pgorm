[workspace]
members = [".", "pgorm-macros", "pgorm-codegen", "pgorm-migration", "pgorm-pool", "pgorm-query", "pgorm-query/pgorm-query-attr", "pgorm-query/pgorm-query-derive", "pgorm-sql-macro"]

[package]
name = "pgorm"
version = "0.2.0"
authors = []
edition = "2024"
description = "An async ORM for PostgreSQL"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/pgorm"
repository = "https://github.com/pgorm-rs/pgorm"
categories = ["database"]
keywords = ["async", "orm", "postgres"]
rust-version = "1.88"

[package.metadata.docs.rs]
features = ["default", "debug-print", "postgres-array", "pgorm-internal", "tests-cfg", "sql-macro", "metrics-fingerprint"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "pgorm"
path = "src/lib.rs"

[workspace.dependencies]
async-trait = { version = "0.1.92", default-features = false }
deadpool = { version = "0.13.1", features = ["serde", "rt_tokio_1"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "rc"] }
tokio = { version = "1.53", features = ["full"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "log"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1", "array-impls"] }
pgorm-query = { path = "./pgorm-query", default-features = false, features = ["derive"] }

[dependencies]
pgorm-pool = { path = "./pgorm-pool" }
async-stream = { version = "0.3.6", default-features = false }
async-trait.workspace = true
deadpool.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-postgres.workspace = true
chrono = { version = "0.4.45", default-features = false, optional = true }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
log = { version = "0.4.34", default-features = false }
rust_decimal = { version = "1.43", features = ["db-tokio-postgres"], default-features = false, optional = true }
pg_query = "6.2.0"
pgorm-macros = { version = "0.2.0", path = "pgorm-macros", default-features = false, features = ["strum"] }
pgorm-sql-macro = { version = "0.2.0", path = "pgorm-sql-macro", optional = true }
pgorm-query.workspace = true
strum = { version = "0.28", default-features = false }
serde_json = { version = "1.0.151", default-features = false, optional = true }
uuid = { version = "1.26", default-features = false, optional = true }
url = { version = "2.5", default-features = false }
thiserror = { version = "2.0", default-features = false }
bytes = "1.12"
postgres-protocol = { version = "0.6.12", default-features = false }

[dev-dependencies]
futures = { version = "0.3.34" }
tokio = { version = "1.53", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
pgorm = { path = ".", features = ["debug-print", "tests-cfg", "postgres-array", "pgorm-internal", "sql-macro", "metrics-fingerprint"] }
pretty_assertions = { version = "1.4" }
uuid = { version = "1.26", features = ["v4"] }
arraystring = "0.3"
dotenvy = "0.15.7"
ipnetwork = "0.21.1"
mac_address = "1.1.8"
pgvector = { version = "~0.4.2", default-features = false }

[features]
debug-print = []
default = [
    "macros",
    "with-json",
    "with-chrono",
    "with-rust_decimal",
    "postgres-array",
    "with-uuid",
    "runtime-tokio",
    "macros"
]
macros = ["pgorm-macros/derive"]
# Off by default: brings `sql!` into scope. libpg_query is compiled either way,
# since `pg_query` is a plain dependency for `SelectorRaw` pagination.
sql-macro = ["dep:pgorm-sql-macro"]
# Off by default: fingerprinting costs a parse per statement, so only builds
# that want query identities in their metrics pay for it. libpg_query itself is
# linked either way (see `pg_query` above).
metrics-fingerprint = []
with-json = ["serde_json", "chrono?/serde", "uuid?/serde"]
with-chrono = ["chrono"]
with-rust_decimal = ["rust_decimal"]
with-uuid = ["uuid"]
postgres-array = []
pgorm-internal = []
runtime-tokio = []
tests-cfg = []
