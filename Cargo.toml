[workspace]
members = [".", "pgorm-macros", "pgorm-codegen", "pgorm-migration", "pgorm-pool", "pgorm-query", "pgorm-query/pgorm-query-attr", "pgorm-query/pgorm-query-derive", "pgorm-sql-macro"]

[package]
name = "pgorm"
version = "0.2.0"
authors = []
edition = "2024"
description = "An async ORM for PostgreSQL"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/pgorm"
repository = "https://github.com/pgorm-rs/pgorm"
categories = ["database"]
keywords = ["async", "orm", "postgres"]
rust-version = "1.89"

[package.metadata.docs.rs]
features = ["default", "debug-print", "postgres-array", "pgorm-internal", "tests-cfg", "metrics-fingerprint", "pg-19"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "pgorm"
path = "src/lib.rs"

[workspace.dependencies]
async-trait = { version = "0.1.92", default-features = false }
deadpool = { version = "0.13.1", features = ["serde", "rt_tokio_1"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "rc"] }
tokio = { version = "1.53", features = ["full"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "log"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-jiff-0_2", "with-serde_json-1", "array-impls"] }
pgorm-query = { path = "./pgorm-query", default-features = false, features = ["derive"] }

[dependencies]
pgorm-pool = { path = "./pgorm-pool" }
async-stream = { version = "0.3.6", default-features = false }
async-trait.workspace = true
deadpool.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-postgres.workspace = true
# Required, not optional, for the reason `rust_decimal` below is: `Value::Date`,
# `Time`, `DateTime` and `DateTimeWithTimeZone` are unconditional variants of
# `pgorm-query`'s value model, and the always-built bind path encodes a naive
# datetime itself, naming jiff's civil types to do it. jiff is compiled in
# every configuration anyway — `pgorm-query` and tokio-postgres's
# `with-jiff-0_2` both depend on it — so `with-jiff` gates the conversion
# surface (`TryGetable`, `IntoActiveValue`, the prelude names), not the crate.
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
log = { version = "0.4.34", default-features = false }
# Required, not optional. `Value::Decimal` is an unconditional variant of
# `pgorm-query`'s value model and the `ValueHolder` bind path is always built,
# so `Decimal` has to be bindable in every configuration — its `numeric`
# encoding is also how every integer and float reaches a `numeric` placeholder.
# `db-tokio-postgres` carries that `ToSql` impl and only this dependency edge
# turns it on; `pgorm-query` takes the same crate without it.
rust_decimal = { version = "1.43", features = ["db-tokio-postgres"], default-features = false }
# libpg_query, the PostgreSQL server's own parser: the paginator reads raw
# statements with it, `metrics-fingerprint` hashes with it, and the `sql!` /
# `prql!` macros, codegen's DDL path and the render and identifier oracles all
# parse with it, so every one of them speaks the grammar it carries.
#
# It is a git dependency on the fork's pgorm/postgres-18 branch, which is
# upstream pg_query.rs 6.2.1 with upstream's unreleased 18.0.0 merged in
# (pganalyze/pg_query.rs#79) and its libpg_query submodule at tag 18.1.0 —
# PostgreSQL 18.6's grammar, the release the test server runs. crates.io's
# pg_query still carries PostgreSQL 17's, which refuses every statement 18
# added (a VIRTUAL generated column, a WITHOUT OVERLAPS key, a named NOT
# NULL). A dependency rather than a `[patch.crates-io]` entry for the reason
# prqlc's below is: a patch reaches only the workspace that declares it.
# Upstream's own 18 release replaces the fork when it ships.
#
# The cost is the one prqlc's states — `cargo publish` refuses a git
# dependency — and the revision is held the same way: pgorm-sql-macro,
# pgorm-codegen and pgorm-query's oracle name the same commit, and
# tests/fork_pin_tests.rs holds every declaration and every committed lockfile
# to it.
pg_query = { git = "https://github.com/necessary-nu/pg_query.rs.git", rev = "09ebc3a4c7f50f3682e890a8372b4c4c99382ed9" }
pgorm-macros = { version = "0.2.0", path = "pgorm-macros", default-features = false, features = ["strum"] }
pgorm-sql-macro = { version = "0.2.0", path = "pgorm-sql-macro" }
# The PRQL compiler behind pgorm::pipeline. Pure Rust but a heavyweight
# compile; a permanent dependency by decision, like pg_query above. The pin
# is exact: the PL AST is not a stable API, and the adapter module is
# written against this one revision.
#
# It is a git dependency on the fork's pgorm/deterministic-star-expansion
# branch — 0.13.14 plus fixes to its SQL generation that upstream has not
# taken:
#   - star expansion is ordered totally, so one pipeline compiles to one
#     projection, the tuple layout a positional decode reads (reproducer: the
#     pipeline-join-distinct-order finding);
#   - the sort a `take` carries is tracked through anchoring, and a relation's
#     interior columns map to the ones its reader exposes, so an inherited
#     ORDER BY names a column and a relation that exist;
#   - a quoted identifier doubles every delimiter, so distinct names stay
#     distinct;
#   - a wildcard used as a key keeps its table prefix, and grouping by one
#     writes a whole-row key with every named column the query reads written
#     beside it, and is refused at compile time where the star itself is read
#     outside an aggregation;
#   - literal keys are left out of GROUP BY and DISTINCT ON, where PostgreSQL
#     would read an integer as a column position;
#   - DISTINCT ON orders by a key's expression when the projection drops it.
# A dependency rather than a `[patch.crates-io]` entry, because a dependency
# travels with pgorm and a patch does not: cargo reads patches from the root
# of the workspace being built and nowhere else, so every detached workspace,
# every compile-suite crate the campaign generates and every downstream
# consumer would resolve stock prqlc from crates.io unless it repeated the
# table.
#
# The cost is publication: `cargo publish` refuses a git dependency with no
# registry version, and giving it one would hand every crates.io consumer the
# stock compiler this exists to avoid, so pgorm is not publishable to
# crates.io while this stands. pgorm-sql-macro names the same revision, and
# tests/fork_pin_tests.rs holds every declaration and every committed
# lockfile to it.
prqlc = { git = "https://github.com/necessary-nu/prql.git", rev = "2ce6a2428ee850b1d1e16c41285f6ae7ee7fbe19", default-features = false }
pgorm-query.workspace = true
strum = { version = "0.28", default-features = false }
serde_json = { version = "1.0.151", default-features = false, optional = true }
uuid = { version = "1.27", default-features = false, optional = true }
url = { version = "2.5", default-features = false }
thiserror = { version = "2.0", default-features = false }
bytes = "1.12"
postgres-protocol = { version = "0.6.12", default-features = false }

[dev-dependencies]
futures = { version = "0.3.34" }
tokio = { version = "1.53", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
pgorm = { path = ".", features = ["debug-print", "tests-cfg", "postgres-array", "pgorm-internal", "metrics-fingerprint"] }
pretty_assertions = { version = "1.4" }
uuid = { version = "1.27", features = ["v4"] }
arraystring = "0.3"
dotenvy = "0.15.7"
ipnetwork = "0.21.1"
mac_address = "1.2.0"
pgvector = { version = "0.4.2", default-features = false }
toml = "1.1"
# The identifier render oracle registers the migration ledger's custom table
# name, which only the migrator renders (tests/identifier_oracle/live_capture.rs).
pgorm-migration = { path = "pgorm-migration" }

[features]
debug-print = []
default = [
    "macros",
    "with-json",
    "with-jiff",
    "postgres-array",
    "with-uuid",
    "runtime-tokio",
    "macros"
]
macros = ["pgorm-macros/derive"]
# Off by default: fingerprinting costs a parse per statement, so only builds
# that want query identities in their metrics pay for it. libpg_query itself is
# linked either way (see `pg_query` above).
metrics-fingerprint = []
# Target PostgreSQL 19 instead of 18, the floor and the default
# ([spec:pgorm:req:sql.target]). The typed surface is pgorm-query's, so this
# forwards to it; the live suite then holds 19's answers where the two
# releases' servers differ, and DATABASE_URL has to name a 19 server.
pg-19 = ["pgorm-query/pg-19"]
with-json = ["serde_json", "jiff/serde", "uuid?/serde"]
with-jiff = []
with-uuid = ["uuid"]
postgres-array = []
pgorm-internal = []
runtime-tokio = []
tests-cfg = []
