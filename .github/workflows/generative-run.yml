name: generative profile

on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true

permissions:
  contents: read

jobs:
  campaign:
    name: generative / ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.profile == 'smoke' && 90 || 330 }}
    env:
      GENERATIVE_PROFILE: ${{ inputs.profile }}
      CARGO_TERM_COLOR: never
      PYTHONPATH: security/generative/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check the interpreter against the declared pin
        run: |
          mkdir -p target/generative-ci
          python3 - <<'PIN'
          import re, sys, tomllib
          project = tomllib.load(open("security/generative/pyproject.toml", "rb"))
          declared = project["project"]["requires-python"]
          bounds = dict(re.findall(r"(>=|<)\s*(\d+(?:\.\d+)*)", declared))
          floor, ceiling = (
              tuple(int(part) for part in bounds[operator].split("."))
              for operator in (">=", "<")
          )
          running = sys.version_info[:2]
          if not floor <= running < ceiling:
              raise SystemExit(f"interpreter {running} is outside {declared}")
          PIN
      - name: Prepare Rust and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
          python3 -m pip install --disable-pip-version-check 'maturin>=1.15,<2' 'uv'
          # The extension is built `--locked --offline`, so its registry
          # entries have to be present before the build command runs.
          cargo fetch --locked --manifest-path security/generative/bridge/Cargo.toml
          rustc --version --verbose > target/generative-ci/runtime.txt
          python3 --version >> target/generative-ci/runtime.txt
          python3 -m maturin --version >> target/generative-ci/runtime.txt
          uv --version >> target/generative-ci/runtime.txt
          docker version >> target/generative-ci/runtime.txt
      - name: Fast runner regressions
        run: python3 security/generative/check.py
      - name: Build the native extension
        run: |
          python3 -m pgorm_campaign.build --output target/generative-build
          cp target/generative-build/build.json target/generative-ci/build.json
      - name: Run the pinned profile
        run: |
          case "$GENERATIVE_PROFILE" in
            smoke) deadline=70m ;;
            # The full profile declares a 24h budget; a hosted runner cannot
            # offer that, so CI bounds it externally and reports what it got.
            full) deadline=300m ;;
            *) exit 1 ;;
          esac
          timeout --signal=TERM --kill-after=60s "$deadline" \
            target/generative-build/venv/bin/python \
            -m pgorm_campaign.campaign_main \
            --profile "$GENERATIVE_PROFILE" \
            --output target/generative-ci/run \
            --build target/generative-build/build.json
      - name: Publish the profile status
        if: always()
        run: python3 security/generative/ci.py "$GENERATIVE_PROFILE" target/generative-ci
      - name: Retain campaign evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generative-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/generative-ci/
          if-no-files-found: error
          retention-days: 14
