name: sqlmap profile

on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true

permissions:
  contents: read

jobs:
  scan:
    name: sqlmap / ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.profile == 'smoke' && 45 || 330 }}
    env:
      SQLMAP_PROFILE: ${{ inputs.profile }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read runtime pin
        id: pins
        run: |
          mkdir -p target/sqlmap-ci
          python3 -c 'import json; print("python=" + json.load(open("security/sqlmap/pins.json"))["python"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Prepare Rust and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          cargo generate-lockfile
          cp Cargo.lock target/sqlmap-ci/workspace-Cargo.lock
          rustc --version --verbose > target/sqlmap-ci/runtime.txt
          python3 --version >> target/sqlmap-ci/runtime.txt
          docker version >> target/sqlmap-ci/runtime.txt
      - name: Build the local runner and adapter
        run: cargo build --locked --manifest-path security/sqlmap/adapter/Cargo.toml --bins
      - name: Fast runner regressions
        run: cargo test --locked --manifest-path security/sqlmap/adapter/Cargo.toml --tests
      - name: Run the pinned profile
        run: |
          case "$SQLMAP_PROFILE" in
            smoke) deadline=30m; extra=() ;;
            full) deadline=300m; extra=(--direct-regressions) ;;
            *) exit 1 ;;
          esac
          timeout --signal=TERM --kill-after=60s "$deadline" \
            security/sqlmap/adapter/target/debug/sqlmap-harness \
            --profile "$SQLMAP_PROFILE" --artifacts target/sqlmap-ci/run "${extra[@]}"
      - name: Publish the profile status
        if: always()
        run: |
          verdict=security/sqlmap/adapter/target/debug/sqlmap-verdict
          # A job that failed before the build has no verdict tool, so publish the
          # not-run status by hand rather than leaving the run without evidence.
          if [ ! -x "$verdict" ]; then
            mkdir -p target/sqlmap-ci
            printf 'sqlmap / %s: NOT-RUN\n\nsetup failed before the verdict tool was built\n' "$SQLMAP_PROFILE" \
              | tee target/sqlmap-ci/ci-summary.txt "$GITHUB_STEP_SUMMARY"
            printf '{"profile": "%s", "status": "not-run", "reason": "setup failed before the verdict tool was built", "inapplicable": {}}\n' \
              "$SQLMAP_PROFILE" > target/sqlmap-ci/ci-status.json
            exit 1
          fi
          "$verdict" "$SQLMAP_PROFILE" target/sqlmap-ci
      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqlmap-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/sqlmap-ci/
          if-no-files-found: error
          retention-days: 14
