name: supply chain

# The schedule is the point of this workflow, not the pull-request trigger. A
# dependency does not have to change to acquire an advisory: the tree can sit
# untouched for a month and become vulnerable because someone else published a
# finding. A check that only ran on PRs would stay green through exactly that.
#
# Work lands on main by push as well as by pull request, so a push there that
# changes a manifest, a lockfile or the policy is audited at once rather than
# at the next scheduled run.

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/supply-chain.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/supply-chain.yml'
  schedule:
    - cron: '17 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        # The latest release, `--locked` so its own dependency resolution is
        # the one it shipped with: a tool that audits supply chain should not
        # float its own dependencies. A release that reads deny.toml
        # differently fails the audit below, and that is when the policy is
        # revisited.
        run: cargo install cargo-deny --locked
      - name: Fetch the advisory database
        # Once, so that every workspace below is judged against one snapshot of
        # it rather than whatever was published between two of their checks.
        run: cargo deny --config deny.toml fetch db
      - name: Resolve the root dependency tree
        # The root Cargo.lock is not tracked (see .gitignore), so there is
        # nothing on disk to audit until it is resolved here.
        run: cargo generate-lockfile
      - name: Check advisories, licenses, sources and bans in every workspace
        # The root workspace is not the whole supply chain. pgorm-python and
        # pgorm-napi ship from their own workspaces, and the Python test
        # fixtures and the security campaigns' crates each resolve their own
        # graph too; none of them is in the root's tree. Each is audited
        # against its own committed lockfile (`--locked`: a lockfile its
        # manifest has moved past fails rather than being re-resolved here)
        # under the one policy in deny.toml, which cargo-deny does not find
        # from a detached workspace by itself. The lockfiles are discovered
        # rather than listed, so a workspace committed tomorrow is audited on
        # its first run. Every workspace is checked before the step fails, so
        # one run names them all. Each workspace's crates are fetched first so
        # the check itself can run `--offline`, which is what holds it to the
        # advisory snapshot fetched above.
        run: |
          workspaces=(.)
          while IFS= read -r lockfile; do
            workspaces+=("$(dirname "$lockfile")")
          done < <(git ls-files -- '*Cargo.lock')
          if [ "${#workspaces[@]}" -lt 2 ]; then
            echo "::error::found no committed Cargo.lock to audit"
            exit 1
          fi
          failed=()
          for workspace in "${workspaces[@]}"; do
            echo "::group::$workspace"
            if ! cargo fetch --locked --manifest-path "$workspace/Cargo.toml" ||
                ! cargo deny --offline --locked --manifest-path "$workspace/Cargo.toml" \
                  --config deny.toml check; then
              failed+=("$workspace")
              echo "::error file=$workspace/Cargo.toml::cargo deny check failed for $workspace"
            fi
            echo "::endgroup::"
          done
          echo "audited ${#workspaces[@]} workspaces"
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'failed: %s\n' "${failed[@]}"
            exit 1
          fi
      - name: Retain the audited lockfile
        # Without this the run reports on a tree that cannot be reconstructed
        # afterwards, which is the same gap that cost the campaign its baseline.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-lockfile
          path: Cargo.lock
          retention-days: 14
