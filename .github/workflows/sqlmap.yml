name: sqlmap

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'security/sqlmap/**'
      - '.github/workflows/sqlmap*.yml'
      - '.config/nspec/config.styx'
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlmap-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/sqlmap-run.yml
    with:
      profile: smoke
  full:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/sqlmap-run.yml
    with:
      profile: full
  # Level 5 / risk 3 over the identifier-position cases. Measured at about 14
  # minutes of scanning (56 scans, the slowest 45s), it rides the full profile's
  # schedule as its own job and status; pull requests keep the smoke gate.
  identifiers:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/sqlmap-run.yml
    with:
      profile: identifiers
