name: sqlmap

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'security/sqlmap/**'
      - '.github/workflows/sqlmap*.yml'
      - '.config/nspec/config.styx'
  pull_request:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share a group, so a new push cancels its superseded
# smoke run. Main pushes, scheduled runs and dispatched runs get groups of their
# own: no later trigger may cancel evidence for a landed revision or displace a
# full scan from its queue.
concurrency:
  group: sqlmap-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: ./.github/workflows/sqlmap-run.yml
    with:
      profile: smoke
  full:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    uses: ./.github/workflows/sqlmap-run.yml
    with:
      profile: full
  # Level 5 / risk 3 over the identifier-position cases. Measured at about 14
  # minutes of scanning (56 scans, the slowest 45s), it rides the full profile's
  # schedule as its own job and status; pull requests keep the smoke gate.
  identifiers:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    uses: ./.github/workflows/sqlmap-run.yml
    with:
      profile: identifiers
  gate:
    name: SQL injection security
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    needs: smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Require the smoke scan
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: test "$SMOKE_RESULT" = success
