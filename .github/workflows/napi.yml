name: Node-API binding

# Work lands on main by direct push, so a pull_request trigger alone never
# fires; the weekly run catches drift no commit triggers, a new runner image
# or a moved PostgreSQL package among it.
on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'pgorm-napi/**'
      - '.github/workflows/napi.yml'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'pgorm-napi/**'
      - '.github/workflows/napi.yml'
  schedule:
    - cron: '41 3 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: napi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtimes:
    name: ${{ matrix.name }} / Node.js 26 and Deno 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: linux-x86_64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The binding's dates and times are Temporal's, a global from
          # Node.js 26, which also strips TypeScript types without a flag.
          node-version: '26'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 'v2.x'
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Linux native build and PostgreSQL tools
        if: runner.os == 'Linux'
        run: |
          # The Python workflow's PostgreSQL apt setup; its comment says why.
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d "$(dirname "$key")"
          sudo curl --fail --silent --show-error --location --output "$key" \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fingerprint=$(GNUPGHOME="$(mktemp -d)" gpg --show-keys --with-colons "$key" \
            | awk -F: '$1 == "pub" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" "Architectures: $(dpkg --print-architecture)" \
            'Components: main' "Signed-By: $key" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev postgresql-18
          echo 'PGORM_TEST_PG_BIN=/usr/lib/postgresql/18/bin' >> "$GITHUB_ENV"
          echo 'OPENSSL=openssl' >> "$GITHUB_ENV"
      - name: macOS native build and PostgreSQL tools
        if: runner.os == 'macOS'
        run: |
          brew install llvm postgresql@18 openssl@3
          echo "PGORM_TEST_PG_BIN=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          # The system's LibreSSL is not the OpenSSL the certificate commands
          # below are written for.
          echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      - name: Start PostgreSQL 18
        run: |
          # A cluster owned by this job, on loopback only, so the suite
          # needs no credentials and nothing else on the runner shares it.
          # It serves TLS with a certificate for localhost from a CA of the
          # job's own, which the suite's verified-TLS case trusts; its other
          # cases connect in plaintext.
          data="$RUNNER_TEMP/pgdata"
          tls="$RUNNER_TEMP/tls"
          mkdir -p "$tls"
          "$OPENSSL" req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=pgorm-napi-test-ca \
            -addext basicConstraints=critical,CA:TRUE -keyout "$tls/ca.key" -out "$tls/ca.pem"
          "$OPENSSL" req -newkey rsa:2048 -nodes -subj /CN=localhost \
            -keyout "$tls/server.key" -out "$tls/server.csr"
          printf '%s\n' 'subjectAltName=DNS:localhost,IP:127.0.0.1' 'basicConstraints=critical,CA:FALSE' \
            'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > "$tls/server.ext"
          "$OPENSSL" x509 -req -in "$tls/server.csr" -CA "$tls/ca.pem" -CAkey "$tls/ca.key" -CAcreateserial \
            -days 2 -extfile "$tls/server.ext" -out "$tls/server.crt"
          chmod 600 "$tls/server.key"
          "$PGORM_TEST_PG_BIN/initdb" -D "$data" -U postgres --auth=trust --encoding=UTF8 --no-locale
          "$PGORM_TEST_PG_BIN/pg_ctl" -D "$data" -l "$RUNNER_TEMP/postgres.log" -w -t 30 \
            -o "-c listen_addresses=127.0.0.1 -c port=54329 -c unix_socket_directories=$RUNNER_TEMP -c ssl=on -c ssl_cert_file=$tls/server.crt -c ssl_key_file=$tls/server.key" start
          "$PGORM_TEST_PG_BIN/psql" -h 127.0.0.1 -p 54329 -U postgres -Atc 'SELECT version()'
          echo 'PGORM_TEST_DSN=postgres://postgres@127.0.0.1:54329/postgres' >> "$GITHUB_ENV"
          echo "PGORM_TEST_CA=$tls/ca.pem" >> "$GITHUB_ENV"
      - name: Check the addon's Rust
        run: |
          cargo fmt --manifest-path pgorm-napi/Cargo.toml --all -- --check
          cargo clippy --manifest-path pgorm-napi/Cargo.toml --locked --target-dir target --all-targets -- -D warnings
          cargo test --manifest-path pgorm-napi/Cargo.toml --locked --target-dir target --lib
      - name: Build the addon
        run: node pgorm-napi/scripts/build.mjs
      - name: Type-check the declarations, module and suite
        working-directory: pgorm-napi
        run: deno check
      - name: Live suite under Node.js
        working-directory: pgorm-napi
        run: node --test "tests/*.test.ts"
      - name: Live suite under Deno
        working-directory: pgorm-napi
        run: deno test --allow-ffi --allow-read --allow-env --allow-run tests/
      # An application's own module: the fixture crate registers its entities
      # and graphs, builds one native library with the binding's API, and runs
      # its suite against it in both runtimes.
      # [spec:pgorm:req:napi.application]
      - name: Application module with registered entities
        run: |
          cargo fmt --manifest-path pgorm-napi/tests/application-binding/Cargo.toml --all -- --check
          cargo clippy --manifest-path pgorm-napi/tests/application-binding/Cargo.toml --locked --target-dir target --all-targets -- -D warnings
          node pgorm-napi/checks/entities.js
      # TypeScript generated for an application's registrations: the codegen
      # fixture's project scaffolded, built and emitted, its declarations held
      # by deno check and its module by a live suite in both runtimes.
      # [spec:pgorm:req:napi.codegen]
      - name: Generated application module
        run: |
          cargo fmt --manifest-path pgorm-napi/tests/codegen-entities/Cargo.toml --all -- --check
          cargo clippy --manifest-path pgorm-napi/tests/codegen-entities/Cargo.toml --locked --target-dir target --all-targets -- -D warnings
          node pgorm-napi/checks/codegen.js
      - name: PostgreSQL log
        if: failure()
        run: cat "$RUNNER_TEMP/postgres.log"

  # The npm packages, as a release would make them: each release platform's
  # addon built on its own runner, the whole set packed once, and that set
  # installed on each platform from a registry serving only its tarballs,
  # into fresh Node.js and Deno projects running the smoke suite. Nothing
  # here publishes; the tarballs are kept for review.
  # [spec:pgorm:req:napi.distribution]
  addon:
    name: ${{ matrix.name }} / release addon
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            os: macos-15
          - name: linux-x64-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      NO_COLOR: '1'
      EXPECTED_PLATFORM: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Linux native build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev
      - name: macOS native build tools
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Build and check the release addon
        run: |
          node pgorm-napi/checks/package.js build
          test -f "target/napi-package/binaries/$EXPECTED_PLATFORM/binary.json"
      - name: Retain the addon
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgorm-napi-addon-${{ matrix.name }}-${{ github.run_id }}
          path: target/napi-package/binaries/
          if-no-files-found: error
          retention-days: 14

  packages:
    name: npm packages
    needs: addon
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # Cargo reads the locked graph the notices are checked against.
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pgorm-napi-addon-*-${{ github.run_id }}
          path: target/napi-package/binaries
          merge-multiple: true
      - name: Pack every release platform's package and the main package
        run: node pgorm-napi/checks/package.js pack
      - name: Retain the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgorm-napi-packages-${{ github.run_id }}
          path: target/napi-package/tarballs/
          if-no-files-found: error
          retention-days: 14

  install:
    name: ${{ matrix.name }} / installed packages, Node.js 26 and Deno 2
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            os: macos-15
          - name: linux-x64-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NO_COLOR: '1'
      EXPECTED_PLATFORM: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 'v2.x'
      - name: Linux PostgreSQL tools
        if: runner.os == 'Linux'
        run: |
          # The Python workflow's PostgreSQL apt setup; its comment says why.
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d "$(dirname "$key")"
          sudo curl --fail --silent --show-error --location --output "$key" \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fingerprint=$(GNUPGHOME="$(mktemp -d)" gpg --show-keys --with-colons "$key" \
            | awk -F: '$1 == "pub" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" "Architectures: $(dpkg --print-architecture)" \
            'Components: main' "Signed-By: $key" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get update
          sudo apt-get install --yes postgresql-18
          echo 'PGORM_TEST_PG_BIN=/usr/lib/postgresql/18/bin' >> "$GITHUB_ENV"
      - name: macOS PostgreSQL tools
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "PGORM_TEST_PG_BIN=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
      - name: Start PostgreSQL 18
        run: |
          # A cluster owned by this job, on loopback only; the smoke suite
          # connects in plaintext.
          data="$RUNNER_TEMP/pgdata"
          "$PGORM_TEST_PG_BIN/initdb" -D "$data" -U postgres --auth=trust --encoding=UTF8 --no-locale
          "$PGORM_TEST_PG_BIN/pg_ctl" -D "$data" -l "$RUNNER_TEMP/postgres.log" -w -t 30 \
            -o "-c listen_addresses=127.0.0.1 -c port=54329 -c unix_socket_directories=$RUNNER_TEMP" start
          "$PGORM_TEST_PG_BIN/psql" -h 127.0.0.1 -p 54329 -U postgres -Atc 'SELECT version()'
          echo 'PGORM_TEST_DSN=postgres://postgres@127.0.0.1:54329/postgres' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgorm-napi-packages-${{ github.run_id }}
          path: target/napi-package/tarballs
      - name: Install the packages and run the smoke suite in both runtimes
        run: |
          node pgorm-napi/checks/package.js install
          node -e 'const r = require("./target/napi-package/report.json"); if (!r.passed || r.partial || r.platform !== process.env.EXPECTED_PLATFORM) { console.error(r); process.exit(1); }'
      - name: Retain the install report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgorm-napi-install-${{ matrix.name }}-${{ github.run_id }}
          path: target/napi-package/report.json
          if-no-files-found: error
          retention-days: 14
      - name: PostgreSQL log
        if: failure()
        run: cat "$RUNNER_TEMP/postgres.log"
