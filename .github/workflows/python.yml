name: Python distributions

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'pgorm-python/**'
      - '.github/workflows/python.yml'
      - '.config/nspec/config.styx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: ${{ matrix.name }} / CPython 3.14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            machine: arm64
          - name: linux-x86_64
            os: ubuntu-24.04
            machine: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.4'
      - name: Prepare Python and Rust
        run: |
          python -c 'import os, platform; assert platform.machine() == os.environ["EXPECTED_MACHINE"]'
          python -m pip install 'uv==0.11.9'
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Linux native build and PostgreSQL tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev postgresql-16 openssl
          echo 'PGORM_TEST_PG_BIN=/usr/lib/postgresql/16/bin' >> "$GITHUB_ENV"
      - name: macOS native build and PostgreSQL tools
        if: runner.os == 'macOS'
        run: |
          brew install llvm postgresql@16 openssl@3
          echo "PGORM_TEST_PG_BIN=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Build and verify wheel and source distribution
        run: |
          python pgorm-python/tests/with_local_postgres.py \
            python pgorm-python/checks/distribution.py
      - name: Retain packages and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pgorm-python-${{ matrix.name }}-cp314-${{ github.run_id }}
          path: target/python-distribution/
          if-no-files-found: error
          retention-days: 14
