name: Python distributions

# Work lands on main by direct push, so a pull_request trigger alone never
# fires; the weekly run catches drift no commit triggers.
on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'pgorm-python/**'
      - '.github/workflows/python.yml'
      - '.config/nspec/config.styx'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'pgorm-python/**'
      - '.github/workflows/python.yml'
      - '.config/nspec/config.styx'
  schedule:
    - cron: '29 3 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: ${{ matrix.name }} / CPython 3.14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            machine: arm64
          - name: linux-x86_64
            os: ubuntu-24.04
            machine: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Prepare Python and Rust
        run: |
          python -c 'import os, platform; assert platform.machine() == os.environ["EXPECTED_MACHINE"]'
          python -m pip install 'uv'
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Linux native build and PostgreSQL tools
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04's own archive stops at PostgreSQL 16, so 18 comes
          # from the PostgreSQL project's apt repository, set up as
          # https://www.postgresql.org/download/linux/ubuntu/ documents, its
          # signing key held to the published fingerprint before apt trusts it.
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d "$(dirname "$key")"
          sudo curl --fail --silent --show-error --location --output "$key" \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fingerprint=$(GNUPGHOME="$(mktemp -d)" gpg --show-keys --with-colons "$key" \
            | awk -F: '$1 == "pub" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" "Architectures: $(dpkg --print-architecture)" \
            'Components: main' "Signed-By: $key" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev postgresql-18 openssl
          echo 'PGORM_TEST_PG_BIN=/usr/lib/postgresql/18/bin' >> "$GITHUB_ENV"
      - name: macOS native build and PostgreSQL tools
        if: runner.os == 'macOS'
        run: |
          brew install llvm postgresql@18 openssl@3
          echo "PGORM_TEST_PG_BIN=$(brew --prefix postgresql@18)/bin" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Build and verify wheel and source distribution
        run: |
          python pgorm-python/tests/with_local_postgres.py \
            python pgorm-python/checks/distribution.py
      - name: Retain packages and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgorm-python-${{ matrix.name }}-cp314-${{ github.run_id }}
          path: target/python-distribution/
          if-no-files-found: error
          retention-days: 14

  application:
    name: application binding / linux-x86_64 / CPython 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Prepare Python, Rust and PostgreSQL tools
        run: |
          python -m pip install 'uv' 'maturin>=1.15,<2'
          rustup toolchain install stable --profile minimal
          rustup default stable
          # The distribution job's PostgreSQL apt setup; its comment says why.
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d "$(dirname "$key")"
          sudo curl --fail --silent --show-error --location --output "$key" \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fingerprint=$(GNUPGHOME="$(mktemp -d)" gpg --show-keys --with-colons "$key" \
            | awk -F: '$1 == "pub" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          . /etc/os-release
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" "Architectures: $(dpkg --print-architecture)" \
            'Components: main' "Signed-By: $key" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev postgresql-18 openssl
          echo 'PGORM_TEST_PG_BIN=/usr/lib/postgresql/18/bin' >> "$GITHUB_ENV"
      - name: Build, install and exercise the application wheel
        run: |
          python pgorm-python/tests/with_local_postgres.py \
            python pgorm-python/checks/entities.py
      - name: Retain the application wheel and its report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgorm-python-application-${{ github.run_id }}
          path: target/python-entities/
          if-no-files-found: error
          retention-days: 14
