name: generative

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'security/generative/**'
      - 'pgorm-python/**'
      - '.github/workflows/generative*.yml'
      - '.config/nspec/config.styx'
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share one group, so a newer push cancels the superseded
# smoke run. A scheduled or dispatched run gets a group of its own: a full
# campaign runs for hours, and no later trigger may cancel it or displace it
# from a queue.
concurrency:
  group: generative-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/generative-run.yml
    with:
      profile: smoke
  full:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/generative-run.yml
    with:
      profile: full
