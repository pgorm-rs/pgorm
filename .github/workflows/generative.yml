name: generative

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'security/generative/**'
      - 'pgorm-python/**'
      - '.github/workflows/generative*.yml'
      - '.config/nspec/config.styx'
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generative-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/generative-run.yml
    with:
      profile: smoke
  full:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/generative-run.yml
    with:
      profile: full
