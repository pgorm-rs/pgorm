name: generative

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'security/generative/**'
      - 'pgorm-python/**'
      - '.github/workflows/generative*.yml'
      - '.config/nspec/config.styx'
  pull_request:
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share one group, so a newer push cancels the superseded
# smoke run. Main pushes, scheduled runs and dispatched runs get groups of their
# own: no later trigger may cancel evidence for a landed revision or displace a
# full campaign from its queue.
concurrency:
  group: generative-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: ./.github/workflows/generative-run.yml
    with:
      profile: smoke
  full:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    uses: ./.github/workflows/generative-run.yml
    with:
      profile: full
  gate:
    name: Generative security
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    needs: smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Require the smoke campaign
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: test "$SMOKE_RESULT" = success
