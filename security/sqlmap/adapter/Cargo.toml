[package]
name = "pgorm-sqlmap-adapter"
version = "0.0.0"
edition = "2024"
publish = false

# Independent test package: none of these dependencies enter pgorm's runtime.
[workspace]

[dependencies]
pgorm = { path = "../../.." }
axum = "=0.8.9"
tokio = { version = "=1.53.0", features = ["full"] }
tokio-postgres = "=0.7.18"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
url = "=2.5.8"
libc = "=0.2.189"

# This package declares its own workspace above, and a crates-io patch table is
# read from a workspace root and nowhere else — so the root's prqlc pin has to
# be repeated here. Without it the adapter links stock prqlc and sqlmap scans a
# different SQL generator from the one pgorm ships; the fork carries 9023adad,
# which changes how an identifier is quoted, and identifier handling is where
# injection through an ORM would live.
[patch.crates-io]
prqlc = { git = "https://github.com/necessary-nu/prql.git", rev = "d6f2fa9753699a4c97385679aa908a032a4afbe4" }
