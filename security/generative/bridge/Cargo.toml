[package]
name = "pgorm-generative-bridge"
version = "0.2.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pgorm-python = { path = "../../../pgorm-python", default-features = false }
pgorm = { path = "../../.." }
pyo3 = "=0.29.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
async-trait = "=0.1.92"

[lints.rust]
unsafe_code = "forbid"

# This crate declares its own workspace above, and a crates-io patch table is
# read from a workspace root and nowhere else — so the root's prqlc pin has to
# be repeated here or the campaign's subject links upstream prqlc and tests a
# different SQL generator from the one the fixes landed in.
[patch.crates-io]
prqlc = { git = "https://github.com/necessary-nu/prql.git", rev = "9023adad92b5028fcd3416706069477375e405e4" }
