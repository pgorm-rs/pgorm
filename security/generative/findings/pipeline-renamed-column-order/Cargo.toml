[package]
name = "pgorm-column-order-replay"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "pgorm-column-order-replay"
path = "native.rs"

[dependencies]
pgorm = { path = "../../../.." }

# The workspace above is this crate's own, so it resolves [patch.crates-io]
# here and never from the root. This finding is not the star expansion the
# fork's b2baa230 made deterministic, as the README says and as re-measuring
# on 2026-09-17 confirmed: the crate emits byte-identical SQL under stock
# 0.13.14 and under the pinned fork. Pinned because the pin costs the
# reproducer nothing and it should demonstrate against the compiler pgorm
# ships.
[patch.crates-io]
prqlc = { git = "https://github.com/necessary-nu/prql.git", rev = "2ce6a2428ee850b1d1e16c41285f6ae7ee7fbe19" }
