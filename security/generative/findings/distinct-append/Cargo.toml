[package]
name = "pgorm-distinct-replay"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "pgorm-distinct-replay"
path = "native.rs"

[dependencies]
pgorm = { path = "../../../.." }

# The workspace above is this crate's own, so it resolves [patch.crates-io]
# here and never from the root. The composition failure recorded in the README
# was fixed on pgorm's side and the assertion now passes, so the reproducer is
# a regression check — and it is only a check of what ships if it links the
# same prqlc the root pins.
[patch.crates-io]
prqlc = { git = "https://github.com/necessary-nu/prql.git", rev = "2ce6a2428ee850b1d1e16c41285f6ae7ee7fbe19" }
