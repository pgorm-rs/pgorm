[package]
name = "pgorm-generative-replay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Standalone replay harness for the pgorm generated-program campaign"

# A detached workspace: the harness resolves against its own lock, depends on
# the checkout under test by path, and never pulls campaign tooling — or
# libpython — into an ordinary pgorm build.
[workspace]

[lib]
name = "pgorm_generative_replay"
path = "src/lib.rs"

[dependencies]
pgorm = { path = "../../.." }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
# `raw_value` backs the decoder's numeric-fidelity check; `float_roundtrip`
# keeps a JSON float's shortest representation across decode and re-render.
serde_json = { version = "=1.0.151", features = ["raw_value", "float_roundtrip"] }
tokio-postgres = "=0.7.18"
chrono = "=0.4.45"
rust_decimal = "=1.43.0"
uuid = "=1.26.0"
bytes = "=1.12.1"
fallible-iterator = "=0.2.0"
postgres-protocol = "=0.6.12"
async-trait = "=0.1.92"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
missing_panics_doc = "deny"
# The report is written to stdout by contract, at exactly one site.
print_stdout = "deny"
print_stderr = "deny"
