[package]
name = "pgorm-sql-macro"
version = "0.2.0"
authors = []
edition = "2024"
description = "Compile-time PostgreSQL grammar validation for raw SQL and PRQL string literals"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/pgorm-rs/pgorm"
documentation = "https://docs.rs/pgorm-sql-macro"
repository = "https://github.com/pgorm-rs/pgorm"
categories = ["database"]
keywords = ["postgres", "sql", "macro"]
rust-version = "1.89"

[lib]
name = "pgorm_sql_macro"
path = "src/lib.rs"
proc-macro = true

[dependencies]
# The pg_query fork at the root crate's revision, so `sql!` and `prql!` hold
# their SQL to the grammar every other parse in pgorm uses. The root manifest
# says why it is a git dependency.
pg_query = { git = "https://github.com/necessary-nu/pg_query.rs.git", rev = "09ebc3a4c7f50f3682e890a8372b4c4c99382ed9" }
proc-macro2 = { version = "1.0.107", default-features = false }
# The same fork, at the same revision, as the root crate's runtime pipeline:
# the two must move in lockstep so `prql!` and `pgorm::pipeline` emit through
# one compiler. The root manifest says why it is a git dependency.
prqlc = { git = "https://github.com/necessary-nu/prql.git", rev = "2ce6a2428ee850b1d1e16c41285f6ae7ee7fbe19", default-features = false }
quote = { version = "1.0.47", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
syn = { version = "3", default-features = false, features = ["full", "parsing", "proc-macro", "printing"] }

[dev-dependencies]
pgorm = { path = ".." }
pgorm-sql-macro = { path = "." }
trybuild = "1.0.122"
