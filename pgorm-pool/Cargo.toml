[package]
name = "pgorm-pool"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Michael P. Jung <michael.jung@terreon.de>"]
description = "Connection pool for tokio-postgres, vendored from deadpool-postgres for pgorm"
keywords = ["async", "database", "pool", "postgres"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pgorm-rs/pgorm"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = []

[dependencies]
async-trait.workspace = true # = "0.1.80"
deadpool.workspace = true
serde.workspace = true
# = { package = "serde", version = "1.0", features = [
#     "derive",
# ], optional = true }
tokio.workspace = true # = { version = "1.29", features = ["rt"] }
tracing.workspace = true # = "0.1.37"
tokio-postgres.workspace = true

[dev-dependencies]
config = { version = "0.15", features = ["json"] }
dotenvy = "0.15.7"
futures = "0.3.34"
futures-util = "0.3.34"
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
