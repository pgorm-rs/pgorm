[package]
name = "pgorm-query-derive"
version = "0.2.0"
authors = [ "Follpvosten <wolfi@karpador.xyz>", "Rene Leveille <rene@nestingsafe.com>" ]
edition = "2024"
description = "Derive macro for pgorm-query's Iden trait"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/pgorm-query"
repository = "https://github.com/pgorm-rs/pgorm"
categories = [ "database" ]
keywords = ["database", "sql", "postgres"]
rust-version = "1.88"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", default-features = false, features = ["parsing", "proc-macro", "derive", "printing"] }
quote = { version = "1.0.47", default-features = false }
heck = { version = "0.5", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
trybuild = "1.0.120"
pgorm-query.workspace = true
strum = { version = "0.28", features = ["derive"] }

[features]
