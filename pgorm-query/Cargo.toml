[package]
name = "pgorm-query"
version = "0.32.0-rc.1"
authors = [
    "Chris Tsang <chris.2y3@outlook.com>",
    "Billy Chan <ccw.billy.123@gmail.com>",
    "Ivan Krivosheev <py.krivosheev@gmail.com>",
]
edition = "2024"
description = "A dynamic query builder for Postgres"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/pgorm-query"
repository = "https://github.com/pgorm-rs/pgorm"
categories = ["database"]
keywords = ["database", "sql", "postgres"]
rust-version = "1.88"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "pgorm_query"
path = "src/lib.rs"

[dependencies]
inherent = "1.0.14"
pgorm-query-attr = { version = "0.1.1", path = "pgorm-query-attr", default-features = false, optional = true }
pgorm-query-derive = { version = "0.4.0", path = "pgorm-query-derive", default-features = false, optional = true }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
postgres-types = { version = "0.2.14", default-features = false }
pgvector = { version = "~0.4.2", default-features = false, features = ["postgres"] }
rust_decimal = { version = "1.43", default-features = false }
uuid = { version = "1.26", default-features = false }
ipnetwork = { version = "0.21.1", default-features = false }
mac_address = { version = "1.1.8", default-features = false }

[dev-dependencies]
pgorm-query = { workspace = true, features = ["tests-cfg"] }
criterion = { version = "0.8" }
pretty_assertions = { version = "1.4" }
pg_query = "6.2.0"

[features]
default = ["derive"]
derive = ["pgorm-query-derive"]
attr = ["pgorm-query-attr"]
tests-cfg = []
all-features = [
    "derive",
    "attr",
]

[[test]]
name = "test-derive"
path = "tests/derive/mod.rs"
required-features = ["derive"]

[[test]]
name = "test-error"
path = "tests/error/mod.rs"
required-features = ["tests-cfg"]

[[test]]
name = "test-postgres"
path = "tests/postgres/mod.rs"
required-features = ["tests-cfg"]

[[bench]]
name = "basic"
harness = false
