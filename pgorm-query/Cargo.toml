[package]
name = "pgorm-query"
version = "0.2.0"
authors = [
    "Chris Tsang <chris.2y3@outlook.com>",
    "Billy Chan <ccw.billy.123@gmail.com>",
    "Ivan Krivosheev <py.krivosheev@gmail.com>",
]
edition = "2024"
description = "A dynamic query builder for Postgres"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/pgorm-query"
repository = "https://github.com/pgorm-rs/pgorm"
categories = ["database"]
keywords = ["database", "sql", "postgres"]
rust-version = "1.88"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "pgorm_query"
path = "src/lib.rs"

[dependencies]
inherent = "1.0.14"
pgorm-query-attr = { version = "0.2.0", path = "pgorm-query-attr", default-features = false, optional = true }
pgorm-query-derive = { version = "0.2.0", path = "pgorm-query-derive", default-features = false, optional = true }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
postgres-types = { version = "0.2.14", default-features = false }
pgvector = { version = "~0.4.2", default-features = false, features = ["postgres"] }
rust_decimal = { version = "1.43", default-features = false }
uuid = { version = "1.26", default-features = false }
ipnetwork = { version = "0.21.1", default-features = false }
mac_address = { version = "1.1.8", default-features = false }

[dev-dependencies]
pgorm-query = { workspace = true, features = ["tests-cfg"] }
criterion = { version = "0.8" }
pretty_assertions = { version = "1.4" }
# The render oracle (tests/postgres/oracle.rs) parses with the pg_query fork at
# the root crate's revision, so a render is held to the grammar the runtime
# parses with. The root manifest says why it is a git dependency.
pg_query = { git = "https://github.com/necessary-nu/pg_query.rs.git", rev = "09ebc3a4c7f50f3682e890a8372b4c4c99382ed9" }

[features]
default = ["derive"]
derive = ["pgorm-query-derive"]
attr = ["pgorm-query-attr"]
tests-cfg = []
# Target PostgreSQL 19 instead of 18, the floor and the default, which no
# feature names ([spec:pgorm:req:sql.target] in docs/spec/sql-ast.md). Additive:
# it adds what only 19 accepts and leaves every 18 render as it is.
pg-19 = []
all-features = [
    "derive",
    "attr",
]

[[test]]
name = "test-derive"
path = "tests/derive/mod.rs"
required-features = ["derive"]

[[test]]
name = "test-error"
path = "tests/error/mod.rs"
required-features = ["tests-cfg"]

[[test]]
name = "test-postgres"
path = "tests/postgres/mod.rs"
required-features = ["tests-cfg"]

[[bench]]
name = "basic"
harness = false
