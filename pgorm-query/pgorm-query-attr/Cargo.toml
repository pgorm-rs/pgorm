[package]
name = "pgorm-query-attr"
version = "0.2.0"
authors = ["Pedro Henrique <hello@exst.fun>"]
edition = "2024"
description = "Proc macros for pgorm-query"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/pgorm-query"
repository = "https://github.com/pgorm-rs/pgorm"
categories = ["database"]
keywords = ["database", "sql", "postgres"]
rust-version = "1.88"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", default-features = false }
quote = { version = "1.0.47", default-features = false }
heck = { version = "0.5", default-features = false }
darling = { version = "0.24", default-features = false }

[dev-dependencies]
trybuild = "1.0.120"
pgorm-query.workspace = true
strum = { version = "0.28", features = ["derive"] }
