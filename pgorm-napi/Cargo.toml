[package]
name = "pgorm-napi"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Asynchronous PostgreSQL access through pgorm from Node.js and Deno, over Node-API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pgorm-rs/pgorm"
publish = false

# A separate workspace keeps the Node-API addon out of ordinary Rust builds,
# as pgorm-python's does for Python ([spec:pgorm:req:bindings.optional]).
[workspace]

# An rlib, which applications registering their entities link. The addon's
# own cdylib is asked of `cargo rustc` (scripts/build.mjs): Cargo leaves a
# cdylib-typed path crate's file names unhashed, so the addon's build and an
# application's, without the `standalone-module` feature, would write one
# library file between them, and either could link the other's.
[lib]
name = "pgorm_napi"

[features]
# The addon's own module. An application that registers its entities
# disables it and exports a module of its own that calls `install`.
default = ["standalone-module"]
standalone-module = []

[dependencies]
pgorm = { version = "0.2.0", path = ".." }
neon = { version = "1.1.2", default-features = false, features = ["napi-6"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
tokio-postgres = "0.7.18"
# The value codecs, the same crates pgorm itself resolves, so the addon
# converts exactly what pgorm's own `Value` holds.
bytes = "1.12.1"
# fallible-iterator stays on 0.2: postgres-protocol 0.6.12, the latest release,
# hands its array and range iterators out through 0.2's `FallibleIterator`, and
# 0.3's is a different trait those types do not implement.
fallible-iterator = "0.2.0"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
postgres-protocol = "0.6.12"
rust_decimal = "1.43.0"
serde_json = { version = "1.0.151", features = ["raw_value", "float_roundtrip"] }
uuid = "1.27.0"
# Connections: the cancellation pgorm-python's runtime uses, row streams and
# COPY's sink, and TLS through rustls verifying against the platform's trust
# store, or a CA the caller supplies.
futures-util = { version = "0.3.34", features = ["sink"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
tokio-postgres-rustls = "0.14.0"
tokio-util = "0.7.20"

# The release addon's profile, which scripts/build.mjs --release and the
# packaging check build with ([spec:pgorm:req:napi.release-builds+1]); the
# crate's own release profile is left as Cargo has it. Whole-program LTO
# through one codegen unit drops the code nothing reaches, and stripping
# removes the symbol table, which a host never reads: it looks up only
# `napi_register_module_v1`, which stays among the exported symbols (the
# Mach-O external symbols, the ELF dynamic table), and the bounds of the
# sections Neon collects its exports in are fixed when the library is linked,
# before it is stripped. Panics still unwind: Neon turns one into a
# JavaScript exception, where an abort would end the host process.
[dev-dependencies]
# The variants of pgorm-query's open enums, behind its hidden tests-cfg
# feature, which the binding's tests walk its translations through.
pgorm-query = { path = "../pgorm-query", default-features = false, features = ["tests-cfg"] }

[profile.addon]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
